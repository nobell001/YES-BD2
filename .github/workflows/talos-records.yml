name: 塔洛斯轴更新

# Leo 2026-11-19 「只要這網站更新 這邊就照著排軸」, then 「等以後抓到新的攻略
# 你要試跑 才更新」: twice a day, read GameKee's 战术教材攻略
# (https://www.gamekee.com/zsca2/697611.html) and, when it has new charts,
# turn them into the 塔洛斯 records (tools/talos_gamekee.py), check them and
# put them on the branch auto/talos-records with a draft pull request.
# Nothing reaches players here: the records are played once in the desktop
# clone first, and Leo merges the pull request (then 同步到 YES-BD2 releases).
# Until then the tool stops 塔洛斯 with 「攻略尚未更新」 by itself
# (src/tasks/talos/stages.py).  Plain scripts, no AI.
# Nothing new (or the same records already waiting): nothing is pushed.
# A failure opens an issue (once while it lasts).

on:
  schedule:
    - cron: "37 2 * * *" # 10:37 Taiwan time
    - cron: "7 14 * * *" # 22:07 Taiwan time
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: talos-records
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: "UTF-8"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Pick the branch
        id: branch
        run: |
          # started by hand on a fix branch: that branch (nothing goes to players)
          if [ "${{ github.event_name }}" != schedule ] && [ "${{ github.ref_name }}" != bd2-auto-dev ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "origin/bd2-auto-dev:tools/talos_gamekee.py" 2>/dev/null; then
            echo "name=bd2-auto-dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bd2-auto-dev has no tools/talos_gamekee.py" >&2
          exit 1

      - run: git checkout "${{ steps.branch.outputs.name }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Leo 2026-11-19: GameKee turns GitHub's plain requests for the page
      # away (567); the script opens it in a browser then
      - name: Install a browser
        run: |
          python -m pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Read the guide
        run: python tools/talos_gamekee.py --message "$RUNNER_TEMP/message.txt" | tee "$RUNNER_TEMP/report.txt"

      - name: Anything new?
        id: changed
        run: |
          data=src/tasks/fiend_hunt/data/talos
          if [ -z "$(git status --porcelain $data)" ]; then
            echo "the guide has nothing new"
            echo "new=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A $data
          # the same records already waiting on the branch: nothing to do
          if git fetch -q origin "$BRANCH" 2>/dev/null && \
             [ "$(git rev-parse "FETCH_HEAD:$data")" = "$(git write-tree --prefix=$data/)" ]; then
            echo "these records already wait on $BRANCH"
            echo "new=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short $data
          echo "new=yes" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: auto/talos-records

      - name: Check the records
        if: steps.changed.outputs.new == 'yes'
        run: python -m unittest tests.test_talos_gamekee tests.test_talos_stages

      - name: Put them on a branch for a test run
        if: steps.changed.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.branch.outputs.name }}
          BRANCH: auto/talos-records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git push -q --force origin "HEAD:$BRANCH"  # the branch only ever holds the newest records
          {
            echo "攻略网站有新的塔洛斯轴（自动转换，还没给玩家）。"
            echo
            echo "**合并前要先在桌面分身试跑一次，战斗正常才合并**（Leo 2026-11-19「你要試跑 才更新」）。合并后「同步到 YES-BD2」发版给玩家。"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --body-file "$RUNNER_TEMP/body.md"
            gh pr comment "$open" --body "攻略网站又有更新，轴已换成最新的，要重新试跑。"
          elif ! gh pr create --draft --base "$BASE" --head "$BRANCH" \
                 --title "$(head -1 "$RUNNER_TEMP/message.txt")" --body-file "$RUNNER_TEMP/body.md"; then
            # the repository may not let this job open pull requests: say it in an issue
            gh issue create --title "塔洛斯新轴等试跑 $(date -u +%F)" \
              --body "新的轴在分支 $BRANCH，要先试跑再合并。$(cat "$RUNNER_TEMP/body.md")"
          fi

      - name: Open an issue when something failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # once while it lasts: the site being down would open one a run
          if [ -n "$(gh issue list --state open --search '塔洛斯轴自动更新失败 in:title' --json number --jq '.[0].number')" ]; then
            exit 0
          fi
          gh issue create \
            --title "塔洛斯轴自动更新失败 $(date -u +%F)" \
            --body "塔洛斯轴的每日更新没有完成，工具里的轴没有被改动。记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
